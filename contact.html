<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Perfume Store | Contact</title>

    <!-- Bootstrap first, then our own styles so they override Bootstrap -->
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== Header with logo ===== -->
    <header class="site-header">
        <img src="logo.png" alt="Luxury Perfume Store logo">
        <p class="tagline">Fresh Fragrances for Everyone</p>
    </header>

    
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <!-- ===== Heading ===== -->
    <div class="section-title">
        <h2>Contact Us</h2>
        <p>We'd love to hear from you</p>
    </div>

    <!-- ===== Store info ===== -->
    <div class="store-info">
        <p>📍 St. 271, Phnom Penh, Cambodia<br>
           📞 +855 12 345 678 &nbsp;·&nbsp; ✉️ hello@luxuryperfume.com<br>
           🕒 Open daily, 9:00 AM – 8:00 PM</p>
    </div>

    
    <section class="contact">
        <form action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Write your message" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- ===== Footer ===== -->
    <footer>
        <p>&copy; 2026 Luxury Perfume Store </p>
        <p>@Kimm_sorng</p>
    </footer>

    <script src="bootstrap.min.js"></script>
</body>
</html>
